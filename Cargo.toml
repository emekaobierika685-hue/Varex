[workspace]
members = [
    "crates/varex-core",
    "crates/varex-wisp",
    "crates/varex-http-relay",
    "crates/varex-rewriter",
    "crates/varex-plugin-host",
    "crates/varex-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
futures = "0.3.31"
bytes = "1.10"
thiserror = "2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
mimalloc = "0.1.48"
globset = "0.4"
async-trait = "0.1"
url = "2.5"
http = "1.2"

# rewriter stack (also compiled to wasm32-unknown-unknown)
lol_html = "2.3"
lightningcss = "1.0.0-alpha.70"
encoding_rs = "0.8"
oxc_allocator = "0.90"
oxc_ast = "0.90"
oxc_codegen = "0.90"
oxc_parser = "0.90"
oxc_span = "0.90"
wasm-bindgen = "0.2.100"

# plugin host
wasmtime = "29"
wasmtime-wasi = "29"

# http relay
wreq = { version = "6.0.0-rc", default-features = false, features = [
    "stream", "json", "gzip", "brotli", "zstd", "http2", "boring-tls",
] }
wreq-util = "3.0.0-rc"
reqwest = { version = "0.12", default-features = false, features = [
    "stream", "gzip", "brotli", "deflate",
] }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
